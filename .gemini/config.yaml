project:
  name: "2026-OS-team-project"
  description: "자율주행용 자동차의 CPU 스케쥴러 시뮬레이터 제작"
  tech_stack:
    - "C++"
    - "OS Kernel Development"
    - "코어의 개수는 P코어 2개, E코어 2개"
    - "사용자의 요구사항을 처리하는 E코어 2개, 생명에 직결되는 인터럽트를 담당하는 P코어 1개, 자율주행(엔진 및 조향) 프로세스를 처리하는 P코어 1개"

review:
  language: ko
  focus:
    - readability
    - performance
    - security
  instructions:
    - 리뷰 결과는 친절한 말투의 한국어로 작성.
    - 코드의 가독성과 유지보수성을 중점적으로 리뷰.
    - 잠재적인 버그가 있는지 확인.
    - 성능 최적화가 가능한 부분이 있다면 제안.
exclude:
  - "*.md"
  - "docs/**"
  - "tests/**"
